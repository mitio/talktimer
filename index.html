<!DOCTYPE html>
<html>
<head>
  <title>Talk Timer</title>

  <meta charset="utf-8">

  <meta property="og:title" content="Simple talk timer">
  <meta property="og:description" content="A simple one-page talk timer, excellent for lightning talks. Works offline, too." />
  <meta property="og:image" content="https://ddimitrov.name/talktimer/timer.png" />
  <meta property="og:image:alt" content="Screenshot of the talk timer in action." />
  <meta property="og:image:width" content="1441" />
  <meta property="og:image:height" content="1164" />

  <style type="text/css">
    body, html {
      min-height: 100%;
    }
    body {
      padding: 0;
      margin: 0;
      border: none;
      font-family: Arial, sans-serif;
    }
    /* Anton, SIL Open Font License 1.1, see lib/vendor/anton/OFL.txt */
    @font-face {
      font-family: Anton;
      src: url(lib/vendor/anton/Anton-Regular.ttf) format('truetype');
      font-weight: bold;
      font-display: swap;
    }
    .timer-display {
      display: none;
      text-align: center;
      line-height: 100%;
      font-size: 100px;
      white-space: nowrap;
      box-sizing: border-box;
      font-family: Anton, Impact, sans-serif-condensed, Arial, sans-serif;
      font-weight: bold;
      letter-spacing: -0.01em;
    }
    .timer-active .timer-display {
      display: block;
    }
    .timer-display .seconds {
      font-size: 0.7em;
      display: inline-block;
      width: 1.2em;
      text-align: left;
      font-weight: normal;
    }
    .hide-seconds .timer-display .seconds {
      display: none;
    }
    body {
      background-color: #000;
    }
    body .timer-display,
    body .help {
      color: #FFF;
    }
    .help {
      padding: 1em 2em;
    }
    .help fieldset {
      margin: 1em 0;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .help p .text {
      display: block;
      margin: 0.3em 0;
    }
    .help p.radio .text {
      display: inline-block;
    }
    .help input {
      font-size: 1.2em;
    }
    .help input[type=number] {
      width: 4em;
    }
    .timer-active .help {
      display: none;
    }
    html.timer-active,
    .timer-active body {
      background-color: green;
    }
    html.little-time-remaining,
    .little-time-remaining body {
      background-color: #C5B231;
    }
    html.no-time-remaining,
    .no-time-remaining body {
      background-color: #8f0000;
    }
    a[href=toggle-fullscreen] .enter { display: block; }
    a[href=toggle-fullscreen] .exit  { display: none; }
    .in-fullscreen a[href=toggle-fullscreen] .enter { display: none; }
    .in-fullscreen a[href=toggle-fullscreen] .exit  { display: block; }
    .controls {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
    }
    .timer-active .controls {
      display: block;
    }
    .controls a {
      display: block;
      float: left;
      padding: 0.5em;
      margin: 0.3em 0.3em 0 0;
      width: 1em;
      height: 1em;
      text-align: center;
      font-weight: bold;
      font-size: 2.2em;
      line-height: 1em;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.5);
      background-color: rgba(255, 255, 255, 0.2);
    }
    .remote-waiting {
      display: none;
      color: #FFF;
      text-align: center;
      padding: 35vh 1em 0;
      font-size: 6vw;
      font-weight: bold;
    }
    .remote-waiting .room-line {
      display: block;
      margin-top: 0.5em;
      font-size: 0.6em;
      font-weight: normal;
      opacity: 0.7;
    }
    .remote-room .remote-waiting {
      display: block;
    }
    .remote-room.timer-active .remote-waiting,
    .remote-room .help {
      display: none;
    }
    .remote-room .controls {
      display: block;
    }
    .remote-room:not(.timer-active) .controls a[href=restart],
    .remote-room:not(.timer-active) .controls a[href=reset] {
      display: none;
    }
    .github { float: right; }
    p a { color: #20C9FF; }
  </style>
  <script type="text/javascript" src="lib/vendor/zepto/zepto.min.js"></script>
  <script type="text/javascript">
    $(function () {
      var params = {};
      var startedAt = null;
      var updateTimerDisplayInterval = null;
      var totalDurationInSeconds = null;
      var warnAtInSeconds = null;
      var timerDisplay = $('.timer-display');

      var storeState = function (state) {
        if (window.localStorage === undefined) return;
        var prefix = '_talk_timer_';

        for (var fieldName in state) {
          localStorage[prefix + fieldName] = state[fieldName];
        }
      };

      var loadState = function () {
        var state = {};
        var prefix = '_talk_timer_';

        if (window.localStorage === undefined) return state;

        for (var key in localStorage) {
          if (key.indexOf(prefix) === 0) {
            state[key.substring(prefix.length)] = localStorage[key];
          }
        }

        return state;
      }

      var setStateInUI = function (state) {
        if (!state) return;

        for (var fieldName in state) {
          var value = state[fieldName];
          var field = $('form input[name="' + fieldName + '"]');

          if (field.eq(0).is('[type=radio]')) {
            field.filter('[value="' + value + '"]').prop('checked', true);
          } else {
            field.val(value);
          }
        }
      };

      var isHexColor = function (colorString) {
        return colorString.match(/^[0-9a-f]{3}|[0-9a-f]{6}$/);
      }

      var parseColor = function (colorString) {
        if (isHexColor(colorString)) {
          return '#' + colorString;
        } else {
          return colorString;
        }
      };

      var initializeFromParams = function (paramsString) {
        if (paramsString.match(/^\d+$/)) {
          params['time'] = paramsString;
          params['time-in'] = 'minutes';
          params['font-height-percentage'] = 70;
        } else if (paramsString !== '') {
          paramsString.split('&').forEach(function(keyValuePair) {
            var pairParts = keyValuePair.split('=');
            var name      = pairParts[0];
            var value     = pairParts[1];

            params[name] = value;
          });
        } else {
          params = {};
        }

        setStateInUI(params);

        if (params['time'] && params['time-in']) {
          totalDurationInSeconds = parseInt(params['time'], 10);

          if (params['time-in'] === 'minutes') {
            totalDurationInSeconds *= 60;
          }
        } else {
          totalDurationInSeconds = null;
        }

        if (!totalDurationInSeconds) {
          return;
        }

        if (params['warn-at'] && params['warn-time-in']) {
          warnAtInSeconds = parseInt(params['warn-at'], 10);

          if (params['warn-time-in'] === 'minutes') {
            warnAtInSeconds *= 60;
          }
        } else {
          warnAtInSeconds = 0;
        }

        $('html').toggleClass('hide-seconds', params['hide-seconds'] === 'true');

        storeState(params);

        restartTimer();
      };

      var updateTimerDisplay = function () {
        var elapsedTime                = Math.round((new Date() - startedAt) / 1000);
        var remainingDurationInSeconds = totalDurationInSeconds - elapsedTime;
        var remainingDurationMinutes   = Math.floor(Math.abs(remainingDurationInSeconds) / 60);
        var remainingDurationSeconds   = Math.abs(remainingDurationInSeconds % 60);

        if (remainingDurationSeconds < 10) {
          remainingDurationSeconds = '0' + remainingDurationSeconds;
        }

        if (remainingDurationInSeconds < 0) {
          remainingDurationMinutes = '-' + remainingDurationMinutes;
        }

        timerDisplay.html(remainingDurationMinutes + '<span class="seconds">:' + remainingDurationSeconds + '</span>');

        if (remainingDurationInSeconds <= warnAtInSeconds) {
          $('html').addClass('little-time-remaining');
        }

        if (remainingDurationInSeconds < 0) {
          $('html').addClass('no-time-remaining');
        }
      };

      var resizeTimerDisplay = function () {
        var height = parseInt($(window).height());
        var fontSizePercentage = params['font-height-percentage'] ? params['font-height-percentage'] / 100.0 : 0.7;

        timerDisplay
          .height(height)
          .css({
            fontSize: (height * fontSizePercentage),
            paddingTop: (height * (1 - fontSizePercentage) / 2)
          });
      };

      var restartTimer = function (startAt) {
        startedAt = (startAt instanceof Date) ? startAt : new Date();

        stopTimer();

        $('html').removeClass('little-time-remaining no-time-remaining').addClass('timer-active');

        updateTimerDisplayInterval = setInterval(updateTimerDisplay, 1000);
        updateTimerDisplay();
        resizeTimerDisplay();
      };

      var stopTimer = function () {
        if (updateTimerDisplayInterval) {
          clearInterval(updateTimerDisplayInterval);
          updateTimerDisplayInterval = null;
        }

        $('html').removeClass('timer-active little-time-remaining no-time-remaining');
      };

      var requestFullscreenOn = function (element) {
        if (element.requestFullscreen) {
          element.requestFullscreen();
        } else if (element.webkitRequestFullscreen) {
          element.webkitRequestFullscreen();
        } else if (element.mozRequestFullScreen) {
          element.mozRequestFullScreen();
        } else if (element.msRequestFullscreen) {
          element.msRequestFullscreen();
        }
      };

      var areWeInFullscreen = function () {
        return (
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
      };

      var exitFullscreen = function () {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      };

      // Remote control. With ?room=<number> in the link, the timer listens to a
      // ntfy.sh topic for commands sent by admin.html and reports back on the
      // same topic. The protocol and its rules are described in AGENTS.md.
      var NTFY_URL = 'https://ntfy.sh/';
      var REMOTE_TOPIC_PREFIX = 'talktimer-room-';
      var REMOTE_STORAGE_KEY = '_talktimer_remote';
      var REMOTE_RESUME_MAX_AGE_MS = 12 * 60 * 60 * 1000; // ntfy.sh keeps messages 12 hours
      var REMOTE_RETRY_MS = 10000;
      var REMOTE_SILENCE_MS = 120000;
      var remote = {
        room: null,        // the room this page listens to
        connection: 0,     // increases on every (re)connect, so stale callbacks can tell
        source: null,      // the open EventSource
        since: null,       // server time of the newest message seen in this room
        seen: {},          // ntfy message ids already handled in this room
        lastAlive: 0,      // when the connection last showed a sign of life
        helloSent: false,  // the "I am online" status goes out once per page load
        state: {}          // what survives a reload, see saveRemoteState
      };

      var parseRoom = function (value) {
        value = (value === undefined || value === null) ? '' : String(value);

        return /^\d{1,12}$/.test(value) ? value : null;
      };

      var loadRemoteState = function () {
        try {
          return JSON.parse(localStorage[REMOTE_STORAGE_KEY] || '{}') || {};
        } catch (e) {
          return {};
        }
      };

      var saveRemoteState = function () {
        remote.state.room = remote.room;

        try {
          localStorage[REMOTE_STORAGE_KEY] = JSON.stringify(remote.state);
        } catch (e) {}
      };

      var rememberRemoteCountdown = function (running) {
        remote.state.running   = running;
        remote.state.total     = totalDurationInSeconds;
        remote.state.warn      = warnAtInSeconds;
        remote.state.hideSeconds = $('html').hasClass('hide-seconds');
        remote.state.startedAt = startedAt ? startedAt.getTime() : null;

        saveRemoteState();
      };

      var remoteSnapshot = function () {
        var snapshot = {
          state: 'waiting',
          total: totalDurationInSeconds || 0,
          warn: warnAtInSeconds || 0,
          hideSeconds: $('html').hasClass('hide-seconds'),
          remaining: null
        };

        if (updateTimerDisplayInterval !== null && totalDurationInSeconds) {
          snapshot.remaining = totalDurationInSeconds - Math.round((new Date() - startedAt) / 1000);

          if (snapshot.remaining < 0) {
            snapshot.state = 'overtime';
          } else if (snapshot.remaining <= snapshot.warn) {
            snapshot.state = 'warning';
          } else {
            snapshot.state = 'running';
          }
        }

        return snapshot;
      };

      // How many messages ntfy.sh still accepts today from this internet address.
      var remoteQuota = function () {
        return fetch(NTFY_URL + 'v1/account')
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (account) {
            if (!account || !account.stats || !account.limits) return null;

            return { left: account.stats.messages_remaining, limit: account.limits.messages };
          })
          .catch(function () {
            return null;
          });
      };

      var sendRemoteStatus = function (ackId) {
        var room = remote.room;

        if (!room) return;

        remoteQuota().then(function (quota) {
          var status = remoteSnapshot();

          status.type = 'status';
          status.ack  = ackId || null;
          status.room = room;

          if (quota) {
            status.left  = Math.max(quota.left - 1, 0); // this status uses one message
            status.limit = quota.limit;
          }

          return fetch(NTFY_URL + REMOTE_TOPIC_PREFIX + room, {
            method: 'POST',
            body: JSON.stringify(status)
          });
        }).catch(function () {});
      };

      var parseRemoteCommand = function (message) {
        var command;

        try {
          command = JSON.parse(message.message);
        } catch (e) {
          return null;
        }

        if (!command || !command.id) return null;
        if (command.type !== 'set' && command.type !== 'ping' && command.type !== 'room') return null;

        return command;
      };

      var applyRemoteCommand = function (command, message) {
        remote.state.lastId   = message.id;
        remote.state.lastTime = message.time;

        if (command.type === 'set') {
          var seconds = parseInt(command.seconds, 10);

          if (!(seconds > 0)) {
            saveRemoteState();
            return;
          }

          totalDurationInSeconds = seconds;
          warnAtInSeconds        = Math.max(parseInt(command.warn, 10) || 0, 0);

          // The control room sends minutes without seconds, or seconds with them.
          if (typeof command.hideSeconds === 'boolean') {
            $('html').toggleClass('hide-seconds', command.hideSeconds);
          }

          restartTimer();
          rememberRemoteCountdown(true);
        } else if (command.type === 'room') {
          var newRoom = parseRoom(command.room);

          if (newRoom && newRoom !== remote.room) {
            joinRemoteRoom(newRoom, true);
          } else {
            saveRemoteState();
          }
        } else {
          saveRemoteState();
        }

        sendRemoteStatus(command.id);
      };

      var handleRemoteMessage = function (message) {
        if (!message || message.event !== 'message' || remote.seen[message.id]) return;

        remote.seen[message.id] = true;

        if (message.time && (!remote.since || message.time > remote.since)) {
          remote.since = message.time;
        }

        // The stream can replay a command this tablet already handled before a
        // reload (ntfy.sh stores a fresh message with a short delay, so the
        // catch-up request may not contain it yet). Never apply it twice.
        if (message.id === remote.state.lastId) return;
        if (remote.state.lastTime && message.time < remote.state.lastTime) return;

        var command = parseRemoteCommand(message);

        if (command) applyRemoteCommand(command, message);
      };

      // Messages that arrived while this page was closed or offline. Only the
      // newest "set" or "room" command is applied, and only if it is newer than
      // the last command this tablet already handled. Returns true if one was.
      var catchUpRemote = function (messages) {
        var startIndex = 0;
        var foundLast  = false;
        var newest     = null;
        var i;

        for (i = 0; i < messages.length; i++) {
          if (messages[i].id === remote.state.lastId) {
            startIndex = i + 1;
            foundLast  = true;
          }
        }

        for (i = 0; i < messages.length; i++) {
          var message  = messages[i];
          var wasSeen  = remote.seen[message.id];
          var isNewer  = foundLast || !remote.state.lastTime || message.time > remote.state.lastTime;

          remote.seen[message.id] = true;

          if (message.time && (!remote.since || message.time > remote.since)) {
            remote.since = message.time;
          }

          if (i < startIndex || wasSeen || !isNewer) continue;

          var command = parseRemoteCommand(message);

          if (command && (command.type === 'set' || command.type === 'room')) {
            newest = { command: command, message: message };
          }
        }

        if (!newest) return false;

        applyRemoteCommand(newest.command, newest.message);

        return true;
      };

      var connectRemote = function () {
        var connection = ++remote.connection;
        var topicUrl   = NTFY_URL + REMOTE_TOPIC_PREFIX + remote.room;

        if (remote.source) {
          remote.source.close();
          remote.source = null;
        }

        var retryLater = function () {
          if (connection !== remote.connection) return;

          if (remote.source) {
            remote.source.close();
            remote.source = null;
          }

          setTimeout(function () {
            if (connection === remote.connection) connectRemote();
          }, REMOTE_RETRY_MS);
        };

        fetch(topicUrl + '/json?poll=1&since=' + (remote.since || 'all'))
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);

            return response.text();
          })
          .then(function (text) {
            if (connection !== remote.connection) return;

            var messages = [];

            text.split('\n').forEach(function (line) {
              if (!line) return;

              try {
                var message = JSON.parse(line);

                if (message.event === 'message') messages.push(message);
              } catch (e) {}
            });

            var applied = catchUpRemote(messages);

            if (!remote.helloSent) {
              remote.helloSent = true;

              if (!applied) sendRemoteStatus(null);
            }

            // Catching up may have moved this page to another room.
            if (connection !== remote.connection) return;

            var source = new EventSource(topicUrl + '/sse?since=' + (remote.since || 'all'));
            var alive  = function () {
              remote.lastAlive = Date.now();
            };

            remote.source = source;
            alive();

            source.addEventListener('open', alive);
            source.addEventListener('keepalive', alive);

            source.onmessage = function (e) {
              alive();

              if (connection !== remote.connection) return;

              try {
                handleRemoteMessage(JSON.parse(e.data));
              } catch (err) {}
            };

            source.onerror = retryLater;
          })
          .catch(retryLater);
      };

      var joinRemoteRoom = function (room, rewriteLink) {
        remote.room  = room;
        remote.since = null;
        remote.seen  = {};

        $('.remote-waiting .room').text(room);

        if (rewriteLink && window.history && history.replaceState) {
          var search = location.search.replace(/([?&]room=)[^&]*/, '$1' + room);

          history.replaceState(null, '', location.pathname + search + location.hash);
        }

        saveRemoteState();
        connectRemote();
      };

      var startRemote = function (roomFromLink) {
        var room = parseRoom(roomFromLink);

        if (!room) return;

        $('html').addClass('remote-room');

        if (!window.fetch || !window.EventSource || !window.Promise) {
          $('.remote-waiting').text('Remote control needs a newer browser.');
          return;
        }

        remote.state = loadRemoteState();

        // A link to another room than the stored one starts from scratch, so
        // this page follows a "room" command that may wait there.
        if (remote.state.room !== room) {
          remote.state = {};
        }

        var age = Date.now() - (remote.state.startedAt || 0);

        // After a reload, continue the countdown the control room started.
        if (remote.state.running && remote.state.total && age < REMOTE_RESUME_MAX_AGE_MS) {
          totalDurationInSeconds = remote.state.total;
          warnAtInSeconds        = remote.state.warn || 0;

          if (typeof remote.state.hideSeconds === 'boolean') {
            $('html').toggleClass('hide-seconds', remote.state.hideSeconds);
          }

          restartTimer(new Date(remote.state.startedAt));
        }

        joinRemoteRoom(room, false);

        setInterval(function () {
          if (remote.source && Date.now() - remote.lastAlive > REMOTE_SILENCE_MS) {
            connectRemote();
          }
        }, 30000);

        window.addEventListener('online', connectRemote);
      };

      $(window).resize(resizeTimerDisplay);

      $('a[href=toggle-fullscreen]').click(function(e) {
        e.preventDefault();

        if (areWeInFullscreen()) {
          exitFullscreen();
          $('html').removeClass('in-fullscreen');
        } else {
          requestFullscreenOn(document.documentElement);
          $('html').addClass('in-fullscreen');
        }
      });

      $('a[href=restart]').click(function(e) {
        e.preventDefault();

        if (!totalDurationInSeconds) return;

        restartTimer();

        if (remote.room) {
          rememberRemoteCountdown(true);
          sendRemoteStatus(null);
        }
      });

      $('a[href=reset]').click(function(e) {
        e.preventDefault();

        stopTimer();

        if (remote.room) {
          rememberRemoteCountdown(false);
          sendRemoteStatus(null);
        }
      });

      $('form').submit(function(e) {
        e.preventDefault();

        var paramsString = $(this).serialize();

        initializeFromParams(paramsString);
      });

      $('#get-link').click(function(e) {
        e.preventDefault();

        var paramsString = $('form').serialize();
        var baseUrl = window.location.toString().split('?')[0];

        var fullLink = baseUrl + '?' + paramsString;

        prompt('Full link to the timer with its current setup:', fullLink);
      });

      var paramsString = location.search.toString().replace(/^\?/, '');

      if (paramsString) {
        initializeFromParams(paramsString);
      } else {
        setStateInUI(loadState());
      }

      startRemote(params['room']);
    });
  </script>
</head>
<body>
  <div class="controls">
    <a href="toggle-fullscreen">
      <span class="enter">↗</span>
      <span class="exit">↙</span>
    </a>
    <a href="restart">↺</a>
    <a href="reset">&times;</a>
  </div>
  <div class="timer-display"></div>
  <div class="remote-waiting">
    Waiting for the control room
    <span class="room-line">Room <span class="room"></span></span>
  </div>
  <div class="help">
    <h1>Talk Timer</h1>
    <form>
      <fieldset>
        <legend>Required</legend>

        <p class="radio">
          <label>
            <span class="text">Time:</span>
            <input name="time" type="number">
          </label>
          <label>
            <input type="radio" name="time-in" value="minutes" checked> minutes
          </label>
          <label>
            <input type="radio" name="time-in" value="seconds"> seconds
          </label>

          <input type="submit" value="Start timer">
        </p>
      </fieldset>

      <fieldset>
        <legend>Optional</legend>

        <p class="radio">
          <label>
            <span class="text">Show "warning" color at:</span>
            <input name="warn-at" type="number">
          </label>
          <label>
            <input type="radio" name="warn-time-in" value="minutes" checked> minutes
          </label>
          <label>
            <input type="radio" name="warn-time-in" value="seconds"> seconds
          </label>
        </p>
        <p class="radio">
          <span class="text">Show seconds:</span>
          <label>
            <input type="radio" name="hide-seconds" value="false" checked> Yes
          </label>
          <label>
            <input type="radio" name="hide-seconds" value="true"> No
          </label>
        </p>
        <p class="radio">
          <label>
            <span class="text">Font height (% from screen height):</span>
            <input name="font-height-percentage" type="number"> %
          </label>
        </p>
      </fieldset>

      <p>
        <span class="github">
          <a href="https://github.com/mitio/talktimer">View instructions and code at GitHub</a>
        </span>
        <input type="submit" value="Start timer">
        or
        <input type="button" value="Get link to the timer with the current setup" id="get-link">
      </p>
    </form>
  </div>
</body>
</html>
